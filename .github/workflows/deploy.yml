name: Test and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: api-monitor-main-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Audit, test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Run unit tests
        run: npm test

      - name: Run TypeScript checks
        run: npm run lint

      - name: Check browser configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Missing Actions variable: VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "Missing Actions variable: VITE_SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          test -n "$VITE_API_BASE_URL" || { echo "Missing Actions variable: VITE_API_BASE_URL"; exit 1; }

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

  deploy:
    name: Deploy testing Worker
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check browser configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Missing Actions variable: VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "Missing Actions variable: VITE_SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          test -n "$VITE_API_BASE_URL" || { echo "Missing Actions variable: VITE_API_BASE_URL"; exit 1; }

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployed Worker health
        env:
          HEALTH_URL: https://10x-api-monitor.apimonitor.workers.dev/health
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$HEALTH_URL" | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 5
          done
          echo "The deployed Worker health check did not return status=ok." >&2
          exit 1

